<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
우체국 디지털금융 체험관 운영 통계
</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="dashboard">


<header>

<h1>
우체국 디지털금융 체험관
</h1>

<p>
운영 통계 대시보드
</p>

</header>



<!-- ==============================
     요약 카드
================================ -->


<section class="summary">


<div class="summary-card">

<h3>
총 접속 건수
</h3>

<strong id="totalVisit">
0
</strong>

<span>
건
</span>

</div>




<div class="summary-card">

<h3>
참여 총괄국
</h3>

<strong id="totalOffice">
0
</strong>

<span>
개
</span>

</div>





<div class="summary-card">

<h3>
콘텐츠 이용 건수
</h3>

<strong id="totalContent">
0
</strong>

<span>
회
</span>

</div>





<div class="summary-card">

<h3>
콘텐츠 이용률
</h3>

<strong id="contentRate">
0
</strong>

<span>
%
</span>

</div>



</section>







<!-- ==============================
     총괄국별 접속 현황
================================ -->


<section class="box">


<h2>
총괄국별 접속 현황
</h2>



<table>


<thead>

<tr>

<th>
총괄국
</th>


<th>
접속 건수
</th>

</tr>


</thead>



<tbody id="officeTable">

</tbody>



</table>


</section>








<!-- ==============================
     콘텐츠별 이용 현황
================================ -->


<section class="box">


<h2>
콘텐츠별 이용 현황
</h2>



<table>


<thead>

<tr>


<th>
콘텐츠
</th>


<th>
이용 횟수
</th>


</tr>


</thead>



<tbody id="contentTable">

</tbody>



</table>


</section>








<!-- ==============================
     총괄국별 콘텐츠 이용 현황
================================ -->


<section class="box">


<h2>
총괄국별 콘텐츠 이용 현황
</h2>



<table>


<thead>


<tr>


<th>
총괄국
</th>


<th>
콘텐츠
</th>


<th>
이용 횟수
</th>


</tr>


</thead>



<tbody id="officeContentTable">

</tbody>



</table>


</section>






</div>



<script type="module" src="admin.js"></script>



</body>

</html>
