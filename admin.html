<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
우체국 디지털금융 체험관 운영 통계
</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="dashboard">



<header>


<h1>
우체국 디지털금융 체험관
</h1>


<p>
운영 통계 대시보드
</p>


</header>







<!-- ==============================
     요약 카드
================================ -->


<section class="summary">



<div class="summary-card">


<h3>
총 접속 건수
</h3>


<strong id="totalVisit">
0
</strong>


<span>
건
</span>


</div>






<div class="summary-card">


<h3>
참여 총괄국
</h3>


<strong id="totalOffice">
0 / 33
</strong>


<span>
개
</span>


</div>







<div class="summary-card">


<h3>
콘텐츠 이용 건수
</h3>


<strong id="totalContent">
0
</strong>


<span>
회
</span>


</div>







<div class="summary-card">


<h3>
콘텐츠 이용률
</h3>


<strong id="contentRate">
0
</strong>


<span>
%
</span>


</div>



</section>







<!-- ==============================
     기간 조회
================================ -->


<section class="box">


<h2>
조회 기준
</h2>



<table>


<tbody>


<tr>


<td>
시작일
</td>


<td>

<input 
type="date"
id="startDate">


</td>



<td>
종료일
</td>


<td>

<input 
type="date"
id="endDate">


</td>


<td>

<button
id="searchBtn">

조회

</button>


</td>


</tr>


</tbody>


</table>



</section>

<!-- ==============================
     참여 현황
================================ -->


<section class="box">


<h2>
참여 현황
</h2>



<table>


<thead>

<tr>

<th>
구분
</th>

<th>
현황
</th>

</tr>

</thead>



<tbody>


<tr>

<td>
전체 대상 총괄국
</td>


<td id="totalOfficeTarget">
33개
</td>


</tr>




<tr>

<td>
참여 완료
</td>


<td id="participateOfficeCount">
0개
</td>


</tr>




<tr>

<td>
참여율
</td>


<td id="participateRate">
0%
</td>


</tr>


</tbody>


</table>





<br>



<h3>
미참여 총괄국
</h3>



<p id="notParticipateOffice">
없음
</p>



</section>










<!-- ==============================
     월별 운영 현황
================================ -->


<section class="box">


<h2>
월별 운영 현황
</h2>




<table>


<thead>


<tr>


<th>
월
</th>


<th>
접속 건수
</th>


<th>
콘텐츠 이용
</th>


</tr>


</thead>




<tbody id="monthlyTable">


</tbody>



</table>



</section>
<!-- ==============================
     총괄국별 접속 현황
================================ -->


<section class="box">


<h2>
총괄국별 접속 현황
</h2>




<table>


<thead>


<tr>


<th>
총괄국
</th>


<th>
접속 건수
</th>


<th>
상세
</th>


</tr>


</thead>



<tbody id="officeTable">

</tbody>



</table>


</section>









<!-- ==============================
     콘텐츠별 이용 현황
================================ -->


<section class="box">


<h2>
콘텐츠별 이용 현황
</h2>



<table>


<thead>


<tr>


<th>
콘텐츠
</th>


<th>
이용 횟수
</th>


</tr>


</thead>



<tbody id="contentTable">

</tbody>



</table>



</section>









<!-- ==============================
     총괄국별 콘텐츠 이용 현황
================================ -->


<section class="box">


<h2>
총괄국별 콘텐츠 이용 현황
</h2>




<table>


<thead>


<tr>


<th>
총괄국
</th>


<th>
콘텐츠
</th>


<th>
이용 횟수
</th>


</tr>


</thead>




<tbody id="officeContentTable">

</tbody>



</table>



</section>








</div>







<script type="module" src="admin.js"></script>




</body>

</html>
