<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>우체국 디지털금융 체험관</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<div class="card">

<h1>
우체국 디지털금융 체험관
</h1>

<p class="sub">
디지털 금융,<br>
이제 쉽게 이용하세요
</p>

<p class="guide">
원하는 체험을 선택해 보세요
</p>

<hr>


<button class="menu"
onclick="playVideo('videos/phishing.mp4','보이스피싱 예방 영상')">

🎬 보이스피싱 예방 영상 보기

</button>


<button class="menu"
onclick="playVideo('videos/campaign.mp4','금융사기 예방 캠페인송')">

🎵 금융사기 예방 캠페인송 보기

</button>


<button class="menu"
onclick="openBanking()">

📱 잇다뱅킹 사용 연습하기

</button>


<button class="menu"
onclick="openATM()">

🏧 ATM 사용 체험하기

</button>


<button class="menu"
onclick="openKiosk()">

⬇ 연습용 키오스크앱 설치하기

</button>


<hr>


<img
class="logo"
src="images/logo.PNG">

</div>

</div>


<div
id="videoPlayer"
class="video-popup">

<div class="video-box">


<button
class="close"
onclick="closeVideo()">

✕

</button>


<video
id="video"
controls
playsinline>

</video>


</div>

</div>


<script type="module" src="script.js"></script>


</body>

</html>
