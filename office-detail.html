<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
우체국 디지털금융 체험관 - 상세 운영 현황

<link rel="stylesheet" href="admin.css">

</head>



<body>


<div class="dashboard">

<header>

</h1>

총괄국 운영 상세 현황
</p>


</header>









<!-- ==============================
     조회 기준
================================ -->


<section class="box">


<h2>
조회 기준
</h2>



<table>


<tbody>



<tr>


<td>
시작일
</td>


<td>

<input
type="date"
id="detailStartDate">

</td>



<td>
종료일
</td>


<td>

<input
type="date"
id="detailEndDate">

</td>



<td>

<button
id="detailSearchBtn">

조회

</button>


</td>



</tr>



</tbody>


</table>




</section>









<!-- ==============================
     요약 카드
================================ -->


<section class="summary">



<div class="summary-card">


<h3>
총 접속 건수
</h3>


<strong id="detailVisit">
0
</strong>


<span>
건
</span>



</div>








<div class="summary-card">


<h3>
콘텐츠 이용 건수
</h3>


<strong id="detailContent">
0
</strong>


<span>
회
</span>



</div>





</section>









<!-- ==============================
     월별 운영 현황
================================ -->


<section class="box">


<h2>
월별 운영 현황
</h2>




<table>


<thead>


<tr>

<th>
월
</th>


<th>
접속 건수
</th>


<th>
콘텐츠 이용
</th>


</tr>


</thead>




<tbody id="detailMonthlyTable">


</tbody>




</table>



</section>









<!-- ==============================
     콘텐츠 이용 현황
================================ -->


<section class="box">


<h2>
콘텐츠 이용 현황
</h2>




<table>


<thead>


<tr>


<th>
콘텐츠
</th>


<th>
이용 횟수
</th>


</tr>


</thead>



<tbody id="detailContentTable">


</tbody>



</table>



</section>









<!-- ==============================
     운영 현황
================================ -->


<section class="box">


<h2>
운영 현황
</h2>




<p id="detailMessage">

</p>




</section>









</div>
